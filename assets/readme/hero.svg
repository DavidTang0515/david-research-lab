<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">David Research Lab</title>
  <desc id="desc">将经过核实的日常信号沉淀为长期研究知识的个人研究系统。</desc>

  <rect width="1200" height="380" rx="28" fill="#F8F6EF"/>
  <rect x="700" width="500" height="380" rx="28" fill="#EEF0E8"/>
  <path d="M700 0H1172Q1200 0 1200 28V352Q1200 380 1172 380H700Z" fill="#EEF0E8"/>
  <path d="M700 28V352" stroke="#D8D9D0" stroke-width="1.5"/>

  <g id="title-block" transform="translate(64 48)">
    <text x="0" y="0" fill="#1C6B63" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2">RESEARCH OPERATING SYSTEM</text>
    <rect x="0" y="25" width="54" height="4" rx="2" fill="#1C6B63"/>

    <text x="0" y="98" fill="#1D201E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="56" font-weight="750">David Research</text>
    <text x="0" y="160" fill="#1D201E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="56" font-weight="750">Lab</text>

    <text x="0" y="205" fill="#4E5550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="500">把经过核实的日常信号，沉淀为长期知识。</text>
    <text x="0" y="238" fill="#6C716D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">日报记录输入，报告记录变化，专题沉淀判断。</text>

    <g transform="translate(0 276)">
      <rect x="0" y="0" width="92" height="32" rx="16" fill="#DCEBE6"/>
      <text x="46" y="21" text-anchor="middle" fill="#1C6B63" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">EVIDENCE</text>
      <path d="M104 16H132" stroke="#B6BCB4" stroke-width="1.5"/>
      <circle cx="144" cy="16" r="3" fill="#1C6B63"/>
      <text x="158" y="21" fill="#6C716D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">SIGNAL</text>
      <path d="M226 16H254" stroke="#B6BCB4" stroke-width="1.5"/>
      <circle cx="266" cy="16" r="3" fill="#1C6B63"/>
      <text x="280" y="21" fill="#6C716D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">KNOWLEDGE</text>
    </g>
  </g>

  <g id="research-loop" transform="translate(760 44)">
    <text x="0" y="0" fill="#6C716D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="1.5">THE RESEARCH LOOP</text>
    <path d="M45 66C45 118 45 184 45 294" fill="none" stroke="#B6BCB4" stroke-width="2"/>
    <circle cx="45" cy="70" r="8" fill="#1C6B63"/>
    <circle cx="45" cy="140" r="8" fill="#1C6B63"/>
    <circle cx="45" cy="210" r="8" fill="#1C6B63"/>
    <circle cx="45" cy="280" r="8" fill="#1C6B63"/>

    <g transform="translate(82 42)">
      <rect width="292" height="56" rx="14" fill="#FFFFFF" stroke="#D8D9D0" stroke-width="1.5"/>
      <text x="24" y="25" fill="#1D201E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="23" font-weight="700">Daily</text>
      <text x="24" y="44" fill="#6C716D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17">输入层 · 事实与来源</text>
      <text x="250" y="32" fill="#1C6B63" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">01</text>
    </g>

    <g transform="translate(82 112)">
      <rect width="292" height="56" rx="14" fill="#FFFFFF" stroke="#D8D9D0" stroke-width="1.5"/>
      <text x="24" y="25" fill="#1D201E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="23" font-weight="700">Reports</text>
      <text x="24" y="44" fill="#6C716D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17">阶段层 · 变化与复盘</text>
      <text x="250" y="32" fill="#1C6B63" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">02</text>
    </g>

    <g transform="translate(82 182)">
      <rect width="292" height="56" rx="14" fill="#FFFFFF" stroke="#D8D9D0" stroke-width="1.5"/>
      <text x="24" y="25" fill="#1D201E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="23" font-weight="700">Topics</text>
      <text x="24" y="44" fill="#6C716D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17">长期层 · 可复用知识</text>
      <text x="250" y="32" fill="#1C6B63" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">03</text>
    </g>

    <g transform="translate(82 252)">
      <rect width="292" height="56" rx="14" fill="#1C6B63"/>
      <text x="24" y="25" fill="#F8F6EF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="23" font-weight="700">Dashboard</text>
      <text x="24" y="44" fill="#DCEBE6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17">当前层 · 状态与判断</text>
      <text x="250" y="32" fill="#F8F6EF" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">04</text>
    </g>
  </g>
</svg>
